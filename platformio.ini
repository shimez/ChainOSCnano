[platformio]
default_envs = m5nanoc6

[env:m5nanoc6]
; ESP32-C6 Arduino support is provided by the pioarduino platform. The
; official PlatformIO espressif32 6.x platform rejects Arduino builds for C6.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; M5NanoC6 uses an ESP32-C6FH4 (4 MB Flash). The generic DevKitM C6
; definition matches that memory size; all used GPIOs are assigned explicitly.
board = esp32-c6-devkitm-1
framework = arduino
monitor_speed = 115200

board_build.flash_size = 4MB
; Share the same 3 MB application layout with Arduino IDE.
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCHAINOSCNANO_PLATFORMIO

lib_deps =
  m5stack/M5Chain@1.0.8
  adafruit/Adafruit NeoPixel@^1.12.3
  hideakitai/ArduinoOSC@0.6.0
  bblanchon/ArduinoJson@^7.4.2

monitor_filters =
  esp32_exception_decoder
  time
